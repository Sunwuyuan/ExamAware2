name: 构建和测试包

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'packages/core/**'
      - 'packages/player/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/build-packages.yml'
  
  push:
    branches:
      - main
      - develop
    paths:
      - 'packages/core/**'
      - 'packages/player/**'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20, 22]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: 设置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: |
          pnpm --filter @examaware/core type-check
          pnpm --filter @examaware/player type-check

      - name: 代码检查
        continue-on-error: true
        run: |
          pnpm --filter @examaware/core lint || echo "⚠️ Core lint 跳过"
          pnpm --filter @examaware/player lint || echo "⚠️ Player lint 跳过"

      - name: 构建所有包
        run: |
          pnpm --filter @examaware/core build
          pnpm --filter @examaware/player build

      - name: 检查构建产物
        run: |
          ls -la packages/core/dist/
          ls -la packages/player/dist/
          
          # 检查必要的文件是否存在
          test -f packages/core/dist/index.js
          test -f packages/core/dist/index.mjs
          test -f packages/core/dist/index.d.ts
          test -f packages/player/dist/index.js
          test -f packages/player/dist/index.mjs
          test -f packages/player/dist/index.d.ts

      - name: 测试包导入
        run: |
          cd packages/core
          node -e "const core = require('./dist/index.js'); console.log('✅ @examaware/core CJS 导入成功');"
          node --input-type=module -e "import('./dist/index.mjs').then(() => console.log('✅ @examaware/core ESM 导入成功'));"
          
      - name: 上传构建产物
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/core/dist
            packages/player/dist
          retention-days: 7
